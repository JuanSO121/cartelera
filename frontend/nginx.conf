# Nginx sirve el frontend y reenvía la API a cada microservicio: el navegador ve un solo
# origen, así que no hace falta configurar CORS. Hace lo mismo que proxy.conf.json en desarrollo.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Portadas de hasta 2 MB (el límite real lo valida movie-service).
  client_max_body_size 3m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # El prefijo más largo gana: /api/rentals va a rental-service y el resto de /api a movie-service.
  location /api/rentals {
    proxy_pass http://rental-service:8082;
  }

  location /api/ {
    proxy_pass http://movie-service:8081;
  }

  location /uploads/ {
    proxy_pass http://movie-service:8081;
  }

  # Archivos con hash en el nombre: se pueden cachear sin límite, nunca cambian.
  location ~* \.(?:js|css|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rutas de Angular (/admin, /movies/5, /my-rentals): siempre se entrega index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
