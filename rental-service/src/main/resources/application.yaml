server:
  port: 8082

spring:
  application:
    name: rental-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/rentals_db
    username: ${DB_USER:movies}
    password: ${DB_PASSWORD:movies}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  movie-service-url: ${MOVIE_SERVICE_URL:http://localhost:8081}
  rental-duration: 48h