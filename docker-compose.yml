services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies"]
      interval: 5s
      retries: 10

volumes:
  pgdata: